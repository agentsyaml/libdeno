# The v8 crate's output rlib exceeds sccache's archive member limit
# ("Archive member size is too large"), so bypass any machine-global
# sccache wrapper configured in ~/.cargo/config.toml for this project.
# Note: this only beats the *config file* — a shell-level RUSTC_WRAPPER env
# var outranks it and would silently re-enable sccache.
[build]
rustc-wrapper = ""

# Development-only linker flags so the example host binary re-exports the
# napi_* symbols that dlopen'ed .node native addons resolve.
# Embedded hosts do this in their own build.rs instead, e.g.
# `deno_napi::print_linker_flags("<host-binary-name>")`.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))']
rustflags = ["-C", "link-arg=-Wl,--export-dynamic"]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-export_dynamic"]

# No Windows block here: a global `/EXPORT:napi_register_module_v1` rustflag
# makes every dependency build script fail with LNK2001 (the symbol only
# exists in binaries that link deno_napi). Windows hosts that need the napi
# symbol exported for dlopen'ed .node addons must call
# `deno_napi::print_linker_flags("<host-binary-name>")` from their own
# build.rs, which scopes the flag to that host binary only.
