# Verifies the artifacts users actually download, not the ones CI just built.
# Build-time smoke tests cannot catch a broken upload, a stale artifact, or an
# OS-specific runtime failure. This workflow installs from PyPI and crates.io
# and runs a real script.
name: Published artifact smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install (blank = newest published)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

env:
  REQUESTED_VERSION: ${{ inputs.version }}

jobs:
  pypi:
    name: PyPI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install published wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv smoke
          if [ -d smoke/Scripts ]; then PY="$PWD/smoke/Scripts/python.exe"; else PY="$PWD/smoke/bin/python"; fi
          if [ -n "$REQUESTED_VERSION" ]; then
            spec="libdeno==$REQUESTED_VERSION"
          else
            spec="libdeno"
          fi
          "$PY" -m pip install --quiet --upgrade "$spec"
          printf 'PY=%s\n' "$PY" >> "$GITHUB_ENV"
          "$PY" -c 'import importlib.metadata as m; print("installed", m.version("libdeno"))'
      - name: Run a real program
        shell: bash
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import pathlib
          import tempfile

          import libdeno

          root = pathlib.Path(tempfile.mkdtemp())
          (root / "dep.js").write_text("export const answer = 42;\n", encoding="utf-8")
          (root / "app.js").write_text(
              'import { answer } from "./dep.js";\n'
              "if (answer !== 42) Deno.exit(1);\n",
              encoding="utf-8",
          )

          assert libdeno.run("app.js", cwd=root, allow_all_permissions=True) == 0
          runtime = libdeno.Runtime(root)
          assert runtime.run("app.js", permissions=("--allow-read=.",)) == 0
          assert runtime.run("app.js", permissions=("--allow-read=.",)) == 0
          print("pypi smoke ok")
          PY

  crates-io:
    name: crates.io (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run a consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo new --quiet consumer
          cd consumer
          if [ -n "$REQUESTED_VERSION" ]; then
            cargo add --quiet "libdeno@=$REQUESTED_VERSION"
          else
            cargo add --quiet libdeno
          fi
          cat > src/main.rs <<'RS'
          fn main() {
              let options = libdeno::LibdenoOptions {
                  allow_all_permissions: true,
                  ..Default::default()
              };
              println!("exit={}", libdeno::run("app.js", &options).expect("run"));
          }
          RS
          printf 'console.log("crates.io smoke ok");\n' > app.js
          cargo run --release