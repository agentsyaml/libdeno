name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Supply chain: every `uses:` is pinned to a full commit SHA; the trailing
# comment names the version/ref it corresponds to. Bump via dependabot
# (github-actions ecosystem) or `gh api repos/<owner>/<repo>/commits/<ref>`.

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = arm64, macos-15-intel = x86_64 (both standard labels;
        # macos-13 is retired and macos-14 is deprecated).
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # V8 snapshot compilation is heavy; cache the whole target dir.
          cache-on-failure: true

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # --locked keeps CI in sync with the committed Cargo.lock (the release
        # publish is --locked too, so lockfile drift fails here, not at tag).
        run: cargo test --all-targets --locked

  release-build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Build (release)
        # Exercises the release profile (optimizations + final link) that the
        # dev-profile test job never touches.
        run: cargo build --release --all-targets --locked

  msrv:
    name: MSRV check (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.95.0 branch

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check (MSRV)
        run: cargo check --locked

  audit:
    name: cargo audit (deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo audit runs as a cargo subcommand, so a toolchain is required.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      # Prebuilt binary from the official rustsec/cargo-audit release, instead
      # of a 3-5 min `cargo install --locked cargo-audit` on every run.
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit

      # Upstream-tracked advisories are ignored in .cargo/audit.toml (see
      # SECURITY.md); --deny warnings turns any NEW advisory into a failure.
      - name: Audit
        run: cargo audit --deny warnings
