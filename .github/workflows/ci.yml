name: Rust PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: rust-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Supply chain: every `uses:` is pinned to a full commit SHA; the trailing
# comment names the version/ref it corresponds to. Bump via dependabot
# (github-actions ecosystem) or `gh api repos/<owner>/<repo>/commits/<ref>`.

jobs:
  fast:
    name: Rust PR / fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # --locked keeps CI in sync with the committed Cargo.lock (the release
        # publish is --locked too, so lockfile drift fails here, not at tag).
        run: cargo test --all-targets --locked
