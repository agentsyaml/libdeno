name: Rust PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: rust-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Supply chain: every `uses:` is pinned to a full commit SHA; the trailing
# comment names the version/ref it corresponds to. Bump via dependabot
# (github-actions ecosystem) or `gh api repos/<owner>/<repo>/commits/<ref>`.

jobs:
  fast:
    name: Rust PR / fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: false

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint execution-control feature
        run: cargo clippy --all-targets --features execution-control,phase-diagnostics -- -D warnings

      - name: Test
        # --locked keeps CI in sync with the committed Cargo.lock (the release
        # publish is --locked too, so lockfile drift fails here, not at tag).
        run: cargo test --all-targets --locked

      - name: Prepare execution-control feature test
        run: |
          df -h .
          cargo clean -p libdeno
          df -h .

      - name: Test execution-control feature
        run: cargo test --all-targets --features execution-control,phase-diagnostics --locked
        env:
          CARGO_BUILD_JOBS: 1

      - name: Check docs.rs mode
        run: DOCS_RS=1 cargo check --no-default-features --lib --locked

      - name: Check npm-disabled feature set
        run: cargo check --all-targets --no-default-features --features snapshot --locked

      - name: Check npm-disabled + execution-control feature set
        run: cargo check --all-targets --no-default-features --features snapshot,execution-control,phase-diagnostics --locked

      - name: Check downstream native extension consumer
        run: |
          cp Cargo.lock tests/fixtures/native-extension-consumer/Cargo.lock
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo check --offline --manifest-path tests/fixtures/native-extension-consumer/Cargo.toml

      # ponytail: reclaim this crate's accumulated feature artifacts and serialize
      # large links to reduce cumulative artifact/concurrent-link pressure.
      - name: Prepare npm-disabled feature test
        run: |
          df -h .
          df -i .
          free -h
          cargo clean -p libdeno
          df -h .
          df -i .

      - name: Test npm-disabled feature set
        run: cargo test --no-default-features --features snapshot --lib --test smoke --test runtime --test async_api --locked
        env:
          CARGO_BUILD_JOBS: 1
