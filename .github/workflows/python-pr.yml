name: Python PR smoke

on:
  pull_request:
    paths:
      - "python/**"
      - "src/**"
      - ".cargo/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
      - ".github/workflows/python-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""

jobs:
  smoke:
    name: Python host wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false

      - name: Install host libclang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev

      - name: Build local debug wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Host-only debug build for the short PR gate; no cross-platform container or release build.
          working-directory: python
          command: build
          rust-toolchain: stable
          maturin-version: "v1.11.5"
          args: --locked --out target/pr-wheels

      - name: Install wheel and run Python tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          shopt -s nullglob
          wheels=(python/target/pr-wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          smoke_venv="$RUNNER_TEMP/libdeno-pr-smoke-venv"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --no-index --no-deps "${wheels[0]}"
          "$smoke_venv/bin/python" -m unittest discover -s python/tests -p 'test_*.py'
