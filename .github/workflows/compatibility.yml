name: Rust compatibility

on:
  pull_request:
    paths:
      - "**/*.rs"
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - python/Cargo.toml
      - python/Cargo.lock
      - python/pyproject.toml
      - python/src/**
      - ".cargo/**"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: read

concurrency:
  group: rust-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: locked test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false

      - name: Test
        run: cargo test --all-targets --locked

      - name: Test execution-control feature
        run: cargo test --all-targets --features execution-control,phase-diagnostics --locked

  msrv:
    name: MSRV check (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0 branch

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.9"

      - name: Check Python minimum and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          pyproject = Path("python/pyproject.toml").read_text()
          python_cargo = Path("python/Cargo.toml").read_text()
          versions = []
          for path in (Path("Cargo.toml"), Path("python/pyproject.toml"), Path("python/Cargo.toml")):
              matches = re.findall(r'^version\s*=\s*"([^"]+)"', path.read_text(), re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected exactly one package version")
              versions.append(matches[0])

          if versions.count(versions[0]) != len(versions):
              raise SystemExit(f"release target versions are inconsistent: {versions}")

          requires = re.findall(
              r'^requires-python\s*=\s*"([^"]+)"', pyproject, re.MULTILINE
          )
          if requires != [">=3.9"]:
              raise SystemExit(
                  "python release target must declare requires-python = \">=3.9\"; "
                  f"found {requires!r}"
              )
          if "abi3-py39" not in python_cargo:
              raise SystemExit("python/Cargo.toml must keep PyO3's abi3-py39 feature")
          if not re.search(r'^crate-type\s*=\s*\[\s*"cdylib"\s*\]', python_cargo, re.MULTILINE):
              raise SystemExit("python crate must retain its cdylib release target")
          print(f"validated Rust/Python release version {versions[0]} and Python 3.9 floor")
          PY

      - name: Check (MSRV)
        # --all-targets covers the build script plus lib/bin/example/test/bench targets.
        run: cargo check --all-targets --locked

      - name: Check docs.rs mode (MSRV)
        run: DOCS_RS=1 cargo check --no-default-features --lib --locked

      - name: Check execution-control feature (MSRV)
        run: cargo check --all-targets --features execution-control,phase-diagnostics --locked

      - name: Check Python crate (MSRV)
        run: cargo check --manifest-path python/Cargo.toml --locked
