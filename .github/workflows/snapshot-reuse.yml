# Guards the snapshot bundle export/import contract: a bundle exported by one
# build host must be reusable as-is. Cross-architecture builds depend on that,
# because the snapshot can only be created on the build host's architecture.

name: Snapshot bundle reuse

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - build.rs
      - "build_support/**"
      - src/lib.rs
      - "src/snapshot_identity.rs"
      - "tests/snapshot*.rs"
      - "docs/prebuilt-snapshots.md"
      - .github/workflows/check-version-sync.py
      - scripts/snapshot_compat.py
      - scripts/snapshot_compat_path_tests.py
      - scripts/snapshot_compat_publication_tests.py
      - scripts/test-snapshot-compat.py
      - scripts/test-snapshot-import.py
      - .github/workflows/snapshot-reuse.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    name: reuse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: false

      - name: Export a snapshot bundle
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          set -euo pipefail
          target="$(rustc -vV | awk '$1 == "host:" {print $2}')"
          python3 scripts/snapshot_compat.py export \
            --manifest-path Cargo.toml --target "$target" --bundle "$BUNDLE" -- \
            cargo build --locked --manifest-path Cargo.toml --target "$target" --lib

      - name: Rebuild from the bundle
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          set -euo pipefail
          target="$(rustc -vV | awk '$1 == "host:" {print $2}')"
          python3 scripts/snapshot_compat.py import \
            --manifest-path Cargo.toml --target "$target" --bundle "$BUNDLE" -- \
            cargo build --locked --manifest-path Cargo.toml --target "$target" --lib \
            2>&1 | tee "$RUNNER_TEMP/reuse.log"
          if ! grep -q "reused the prebuilt snapshot" "$RUNNER_TEMP/reuse.log"; then
            echo "::error::the second build did not report reusing the prebuilt snapshot"
            exit 1
          fi

      - name: Run smoke tests against the reused snapshot
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          target="$(rustc -vV | awk '$1 == "host:" {print $2}')"
          python3 scripts/snapshot_compat.py import --manifest-path Cargo.toml \
            --target "$target" --bundle "$BUNDLE" -- cargo test --locked \
            --manifest-path Cargo.toml --target "$target" --test smoke

      - name: Build with import-only feature
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          set -euo pipefail
          python3 scripts/test-snapshot-import.py
          target="$(rustc -vV | awk '$1 == "host:" {print $2}')"
          python3 scripts/snapshot_compat.py import --manifest-path Cargo.toml \
            --target "$target" --bundle "$BUNDLE" -- cargo build --locked \
            --manifest-path Cargo.toml --target "$target" --lib \
            --no-default-features --features snapshot-import,npm

      - name: Run smoke tests with import-only feature
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          target="$(rustc -vV | awk '$1 == "host:" {print $2}')"
          python3 scripts/snapshot_compat.py import --manifest-path Cargo.toml \
            --target "$target" --bundle "$BUNDLE" -- cargo test --locked \
            --manifest-path Cargo.toml --target "$target" --test smoke \
            --no-default-features --features snapshot-import,npm

      - name: Rebuild after same-path bundle mutation
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          set -euo pipefail
          manifest="$BUNDLE/libdeno-snapshot.manifest"
          sidecar="$BUNDLE/libdeno-snapshot.sources"
          backup="$RUNNER_TEMP/snapshot-manifest.backup"
          sidecar_backup="$RUNNER_TEMP/snapshot-sources.backup"
          cp "$manifest" "$backup"
          cp "$sidecar" "$sidecar_backup"
          restore() { cp "$backup" "$manifest"; cp "$sidecar_backup" "$sidecar"; }
          trap restore EXIT
          python3 - "$manifest" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          path.write_bytes(data.replace(b"v8=", b"v8=stale-", 1))
          PY
          python3 - "$manifest" "$sidecar" <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import snapshot_compat
          from pathlib import Path
          manifest, sidecar = map(Path, sys.argv[1:])
          fields = dict(line.split("=", 1) for line in sidecar.read_text(encoding="utf-8").splitlines())
          fields["manifest-hash"] = snapshot_compat.fnv(manifest.read_bytes())
          sidecar.write_bytes("".join(f"{key}={value}\n" for key, value in fields.items()).encode("utf-8"))
          PY
          target="$(rustc -vV | awk '$1 == "host:" {print $2}')"
          if python3 scripts/snapshot_compat.py import --manifest-path Cargo.toml \
            --target "$target" --bundle "$BUNDLE" -- cargo build --locked \
            --manifest-path Cargo.toml --target "$target" --lib \
            --no-default-features --features snapshot-import,npm >"$RUNNER_TEMP/mutated-build.log" 2>&1; then
            echo "::error::same-path bundle mutation did not invalidate the build"
            exit 1
          fi
          grep -q "bundle was built with v8" "$RUNNER_TEMP/mutated-build.log"
          restore
          trap - EXIT

      - name: Confirm import-only omits Deno build dependencies
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked --no-default-features --features snapshot-import,npm -e build --depth 1 --prefix none)
          if grep -Eq '^deno_(runtime|core) v' <<<"$tree"; then
            echo "::error::import-only build tree includes a Deno build dependency"
            exit 1
          fi
