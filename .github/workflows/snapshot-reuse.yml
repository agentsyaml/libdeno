# Guards the snapshot bundle export/import contract: a bundle exported by one
# build host must be reusable as-is. Cross-architecture builds depend on that,
# because the snapshot can only be created on the build host's architecture.

name: Snapshot bundle reuse

on:
  pull_request:
    paths:
      - Cargo.toml
      - build.rs
      - "build_support/**"
      - src/lib.rs
      - "src/snapshot_identity.rs"
      - "tests/snapshot*.rs"
      - "docs/prebuilt-snapshots.md"
      - .github/workflows/check-version-sync.py
      - scripts/test-snapshot-import.py
      - .github/workflows/snapshot-reuse.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    name: reuse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: false

      - name: Export a snapshot bundle
        shell: bash
        env:
          LIBDENO_SNAPSHOT_EXPORT_DIR: ${{ runner.temp }}/bundle
        run: cargo build --locked --lib

      - name: Rebuild from the bundle
        shell: bash
        env:
          LIBDENO_SNAPSHOT_DIR: ${{ runner.temp }}/bundle
        run: |
          set -euo pipefail
          cargo build --locked --lib 2>&1 | tee "$RUNNER_TEMP/reuse.log"
          if ! grep -q "reused the prebuilt snapshot" "$RUNNER_TEMP/reuse.log"; then
            echo "::error::the second build did not report reusing the prebuilt snapshot"
            exit 1
          fi

      - name: Run smoke tests against the reused snapshot
        shell: bash
        env:
          LIBDENO_SNAPSHOT_DIR: ${{ runner.temp }}/bundle
        run: cargo test --locked --test smoke

      - name: Build with import-only feature
        shell: bash
        env:
          LIBDENO_SNAPSHOT_DIR: ${{ runner.temp }}/bundle
        run: |
          python3 scripts/test-snapshot-import.py
          cargo build --locked --lib --no-default-features --features snapshot-import,npm

      - name: Run smoke tests with import-only feature
        shell: bash
        env:
          LIBDENO_SNAPSHOT_DIR: ${{ runner.temp }}/bundle
        run: cargo test --locked --test smoke --no-default-features --features snapshot-import,npm

      - name: Rebuild after same-path bundle mutation
        shell: bash
        env:
          LIBDENO_SNAPSHOT_DIR: ${{ runner.temp }}/bundle
        run: |
          set -euo pipefail
          manifest="$LIBDENO_SNAPSHOT_DIR/libdeno-snapshot.manifest"
          backup="$RUNNER_TEMP/snapshot-manifest.backup"
          cp "$manifest" "$backup"
          restore() { cp "$backup" "$manifest"; }
          trap restore EXIT
          python3 - "$manifest" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          path.write_text(text.replace("v8=", "v8=stale-", 1))
          PY
          if cargo build --locked --lib --no-default-features --features snapshot-import,npm >"$RUNNER_TEMP/mutated-build.log" 2>&1; then
            echo "::error::same-path bundle mutation did not invalidate the build"
            exit 1
          fi
          grep -q "bundle was built with v8" "$RUNNER_TEMP/mutated-build.log"
          restore
          trap - EXIT

      - name: Confirm import-only omits Deno build dependencies
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked --no-default-features --features snapshot-import,npm -e build --depth 1 --prefix none)
          if grep -Eq '^deno_(runtime|core) v' <<<"$tree"; then
            echo "::error::import-only build tree includes a Deno build dependency"
            exit 1
          fi
