name: Python publish

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Python wheels
    uses: ./.github/workflows/python.yml
    permissions:
      contents: read

  publish-pypi:
    name: Publish to PyPI
    if: ${{ startsWith(github.ref, 'refs/tags/python-v') || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libdeno-wheel-*
          path: dist
          merge-multiple: true

      - name: Check wheel versions against the Python tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version=""
          if [[ "$GITHUB_REF" == refs/tags/python-v* ]]; then
            tag_version="${GITHUB_REF_NAME#python-v}"
            test -n "$tag_version"
          fi
          EXPECTED_VERSION="$tag_version" python - <<'PY'
          import os
          import re
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 5:
              raise SystemExit(f"expected exactly five wheel artifacts, found {len(wheels)}")

          versions = {}
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata_names = [
                      name
                      for name in archive.namelist()
                      if re.fullmatch(r"[^/]+\.dist-info/METADATA", name)
                  ]
                  if len(metadata_names) != 1:
                      raise SystemExit(
                          f"{wheel.name}: expected exactly one *.dist-info/METADATA, "
                          f"found {len(metadata_names)}"
                      )
                  metadata = Parser().parsestr(
                      archive.read(metadata_names[0]).decode("utf-8")
                  )
                  values = metadata.get_all("Version") or []
                  if len(values) != 1 or not values[0].strip():
                      raise SystemExit(
                          f"{wheel.name}: expected exactly one non-empty Version field"
                      )
                  versions.setdefault(values[0].strip(), []).append(wheel.name)

          if len(versions) != 1:
              raise SystemExit(f"wheel versions are inconsistent: {versions}")
          version, names = next(iter(versions.items()))
          expected = os.environ.get("EXPECTED_VERSION", "")
          if expected and version != expected:
              raise SystemExit(
                  f"Python tag version {expected!r} does not match wheel version {version!r}"
              )
          print(f"validated version {version} across {len(names)} wheels")
          PY

      - name: Publish to PyPI
        # Official Docker action release ref is required for image lookup; do not replace it with a guessed SHA.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
