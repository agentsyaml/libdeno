name: Rust security

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - python/Cargo.toml
      - python/Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - python/Cargo.toml
      - python/Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/security.yml

permissions:
  contents: read

concurrency:
  group: rust-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit

      - name: Audit root lockfile
        run: cargo audit --deny warnings

      - name: Audit Python lockfile
        run: cargo audit --file python/Cargo.lock --deny warnings
