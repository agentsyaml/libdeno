name: Rust security

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"
  pull_request:
    paths:
      - "**/*.rs"
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - python/Cargo.toml
      - python/Cargo.lock
      - ".cargo/**"
      - ".github/workflows/**"
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - python/Cargo.toml
      - python/Cargo.lock
      - ".cargo/**"
      - ".github/workflows/**"
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: rust-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit

      - name: Check offline Deno/TypeScript version ledger
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path python/Cargo.toml
          cargo metadata --no-deps --format-version=1 --locked --offline >/dev/null
          python .github/workflows/check-version-sync.py

      - name: Audit root lockfile
        run: cargo audit --deny warnings

      - name: Audit Python lockfile
        run: cargo audit --file python/Cargo.lock --deny warnings
