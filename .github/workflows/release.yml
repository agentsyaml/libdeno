# Rust and Python production publishing share this workflow: one version tag
# (vMAJOR.MINOR.PATCH) publishes the crate to crates.io and wheels to PyPI via trusted
# publishing (OIDC, no API token secrets), then creates a GitHub Release.
#
# The tag version must match the version fields in the root Cargo.toml,
# python/pyproject.toml, and python/Cargo.toml; bump them together before
# tagging (the workflow enforces this).
#
# The job declares `environment: crates-io` so GitHub Actions itself records
# the deployment (job outcome = deployment status). Only Actions-created
# deployments populate the "Deployments" card on the repository main page;
# deployment records created via the REST API are not shown there.
#
# One-time setup (crates.io side, in the browser):
# 1. Publish the first version manually (`cargo publish`) — the initial
#    publish requires an API token; later versions can use trusted publishing.
# 2. crates.io -> crate page -> Settings -> Trusted Publishing -> Add ->
#    GitHub: owner `agentsyaml`, repo `libdeno`, workflow `release.yml`,
#    bind the external publisher to environment `crates-io`.
# 3. PyPI -> Account -> Publishing -> Add pending publisher (or the existing
#    project -> Manage -> Publishing): owner `agentsyaml`, repo `libdeno`,
#    workflow `release.yml`, environment `pypi`.
# The workflow enforces the exact repository and strict tag contract before any
# publisher job. Environment required reviewers and tag restrictions are GitHub
# environment settings outside YAML; configure them on `crates-io` and `pypi`.
name: Release

on:
  push:
    tags:
      # GitHub's tag filter cannot express SemVer; the shell guards below are
      # the authoritative vMAJOR.MINOR.PATCH check.
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string
      expected_source_sha:
        description: Expected peeled commit SHA for release_tag
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_version: ${{ steps.identity.outputs.release_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag_object_sha: ${{ steps.identity.outputs.tag_object_sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: control

      - name: Resolve and validate immutable release identity
        id: identity
        working-directory: control
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "agentsyaml/libdeno" || {
            echo "release is restricted to agentsyaml/libdeno"; exit 1;
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "control checkout does not match the workflow SHA"; exit 1;
          }

          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF_TYPE" = "tag" || {
                echo "release push must be a tag ref"; exit 1;
              }
              release_tag="$GITHUB_REF_NAME"
              expected_sha="$GITHUB_SHA"
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main" || {
                echo "manual release dispatch must use main as its control ref"; exit 1;
              }
              release_tag="$INPUT_RELEASE_TAG"
              expected_sha="$INPUT_EXPECTED_SOURCE_SHA"
              ;;
            *)
              echo "unsupported release event: $GITHUB_EVENT_NAME"; exit 1
              ;;
          esac

          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          sha_re='^[0-9a-fA-F]{40}$'
          [[ "$release_tag" =~ $semver_tag_re ]] || {
            echo "expected an exact vMAJOR.MINOR.PATCH tag"; exit 1;
          }
          [[ "$expected_sha" =~ $sha_re ]] || {
            echo "expected_source_sha must be exactly 40 hexadecimal characters"; exit 1;
          }
          expected_sha="${expected_sha,,}"

          tag_ref="refs/tags/$release_tag"
          remote_refs="$(git ls-remote --tags origin "$tag_ref" "$tag_ref^{}")"
          tag_object_sha=""
          source_sha=""
          while IFS=$'\t' read -r object_sha ref_name; do
            [[ "$object_sha" =~ $sha_re ]] || {
              echo "remote tag returned an invalid object SHA"; exit 1;
            }
            if [[ "$ref_name" == "$tag_ref" ]]; then
              tag_object_sha="${object_sha,,}"
            elif [[ "$ref_name" == "$tag_ref^{}" ]]; then
              source_sha="${object_sha,,}"
            fi
          done <<< "$remote_refs"
          [[ -n "$tag_object_sha" && -n "$source_sha" ]] || {
            echo "release_tag must exist remotely as an annotated tag"; exit 1;
          }
          [[ "$source_sha" == "$expected_sha" ]] || {
            echo "release tag peeled SHA does not match expected_source_sha"; exit 1;
          }

          release_version="${release_tag#v}"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tag_object_sha=%s\n' "$tag_object_sha" >> "$GITHUB_OUTPUT"
          printf 'validated %s: tag object %s -> commit %s\n' \
            "$release_tag" "$tag_object_sha" "$source_sha"

      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.identity.outputs.source_sha }}
          path: source

      - name: Verify release source checkout
        working-directory: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || {
            echo "release source checkout $actual does not match $EXPECTED_SOURCE_SHA"; exit 1;
          }

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit

      # Every published artifact must carry the version named by the tag.
      - name: Verify release versions
        shell: bash
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.release_version }}
        run: |
          set -euo pipefail
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $semver_tag_re ]]; then
            echo "expected an exact vMAJOR.MINOR.PATCH tag, got $RELEASE_TAG"
            exit 1
          fi
          tag="${RELEASE_TAG#v}"
          test "$tag" = "$RELEASE_VERSION"
          root_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          python_project_version="$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)"
          python_crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -1)"
          for version in "$root_version" "$python_project_version" "$python_crate_version"; do
            test "$tag" = "$version" || {
              echo "tag v$tag does not match release version $version"; exit 1;
            }
          done

      - name: Verify changelog release section
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ steps.identity.outputs.release_version }}" python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["EXPECTED_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading_re = re.compile(
              rf"^##[ \t]+{re.escape(version)}(?:[ \t]+(?P<suffix>.*?))?[ \t]*$",
              re.MULTILINE,
          )
          matches = list(heading_re.finditer(changelog))
          if len(matches) != 1:
              raise SystemExit(
                  f"CHANGELOG.md must contain exactly one ## {version} heading; "
                  f"found {len(matches)}"
              )

          suffix = matches[0].group("suffix") or ""
          if "(Unreleased)" in suffix:
              raise SystemExit(
                  f"CHANGELOG.md section ## {version} is still marked (Unreleased)"
              )
          print(f"validated released CHANGELOG.md section ## {version}")
          PY

      - name: Check offline Deno/TypeScript version ledger
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path python/Cargo.toml
          cargo metadata --no-deps --format-version=1 --locked --offline >/dev/null
          python .github/workflows/check-version-sync.py

      - name: Test
        working-directory: source
        run: cargo test --all-targets --locked

      - name: Prepare execution-control feature test
        working-directory: source
        run: |
          df -h .
          cargo clean -p libdeno
          df -h .

      - name: Test execution-control feature
        working-directory: source
        run: cargo test --all-targets --features execution-control,phase-diagnostics --locked
        env:
          CARGO_BUILD_JOBS: 1

      - name: Record resources and reclaim libdeno test artifacts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          snapshot_resources() {
            echo "resource snapshot: $(date -u +%FT%TZ)"
            df -h . || true
            df -i . || true
            free -h || true
            du -sh target || true
          }
          snapshot_resources
          cargo clean -p libdeno
          snapshot_resources

      - name: Package and verify final crate
        # `cargo package` verifies the assembled archive by building the
        # packaged source. This catches missing package files before publish;
        # cargo publish must still repeat its registry upload/build path.
        working-directory: source
        env:
          CARGO_BUILD_JOBS: 1
        shell: bash
        run: |
          set -euo pipefail
          snapshot_resources() {
            echo "package resource snapshot: $(date -u +%FT%TZ)"
            df -h . || true
            df -i . || true
            free -h || true
            du -sh target || true
          }
          snapshot_resources
          trap snapshot_resources EXIT
          cargo package --locked

      - name: Audit root lockfile
        working-directory: source
        run: python ../control/.github/workflows/audit-with-temporary-rustls-exceptions.py Cargo.lock

      - name: Audit Python lockfile
        working-directory: source
        run: python ../control/.github/workflows/audit-with-temporary-rustls-exceptions.py python/Cargo.lock

      - name: Test temporary audit exception
        working-directory: control
        run: python .github/workflows/test_audit_temporary_rustls_exceptions.py

  python-build:
    name: build Python wheels
    needs: preflight
    uses: ./.github/workflows/python.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      release_tag: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read

  python-verify:
    name: verify Python wheels
    needs: [preflight, python-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libdeno-wheel-*
          path: dist
          merge-multiple: true

      - name: Check wheel versions against the release tag
        shell: bash
        run: |
          set -euo pipefail
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          release_tag='${{ needs.preflight.outputs.release_tag }}'
          if [[ ! "$release_tag" =~ $semver_tag_re ]]; then
            echo "expected an exact vMAJOR.MINOR.PATCH tag, got $release_tag"
            exit 1
          fi
          tag_version="${release_tag#v}"
          EXPECTED_VERSION="$tag_version" python - <<'PY'
          import os
          import re
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 5:
              raise SystemExit(f"expected exactly five wheel artifacts, found {len(wheels)}")

          versions = {}
          for wheel in wheels:
              if "-cp39-abi3-" not in wheel.name:
                  raise SystemExit(
                      f"{wheel.name}: expected a cp39-abi3 wheel tag"
                  )
              with zipfile.ZipFile(wheel) as archive:
                  metadata_names = [
                      name
                      for name in archive.namelist()
                      if re.fullmatch(r"[^/]+\.dist-info/METADATA", name)
                  ]
                  if len(metadata_names) != 1:
                      raise SystemExit(
                          f"{wheel.name}: expected exactly one *.dist-info/METADATA, "
                          f"found {len(metadata_names)}"
                      )
                  metadata = Parser().parsestr(
                      archive.read(metadata_names[0]).decode("utf-8")
                  )
                  values = metadata.get_all("Version") or []
                  if len(values) != 1 or not values[0].strip():
                      raise SystemExit(
                          f"{wheel.name}: expected exactly one non-empty Version field"
                      )
                  wheel_names = [
                      name
                      for name in archive.namelist()
                      if re.fullmatch(r"[^/]+\.dist-info/WHEEL", name)
                  ]
                  if len(wheel_names) != 1:
                      raise SystemExit(
                          f"{wheel.name}: expected exactly one *.dist-info/WHEEL, "
                          f"found {len(wheel_names)}"
                      )
                  tags = [
                      line.split(":", 1)[1].strip()
                      for line in archive.read(wheel_names[0]).decode("utf-8").splitlines()
                      if line.startswith("Tag:") and ":" in line
                  ]
                  if not any(tag.startswith("cp39-abi3-") for tag in tags):
                      raise SystemExit(
                          f"{wheel.name}: WHEEL metadata does not declare a cp39-abi3 tag"
                      )
                  versions.setdefault(values[0].strip(), []).append(wheel.name)

          if len(versions) != 1:
              raise SystemExit(f"wheel versions are inconsistent: {versions}")
          version, names = next(iter(versions.items()))
          expected = os.environ["EXPECTED_VERSION"]
          if version != expected:
              raise SystemExit(
                  f"release tag version {expected!r} does not match wheel version {version!r}"
              )
          print(f"validated version {version} across {len(names)} wheels")
          PY

  publish-crates:
    name: publish to crates.io
    if: >-
      github.repository == 'agentsyaml/libdeno' &&
      (github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [preflight, python-verify]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: crates-io-publish-${{ needs.preflight.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: source

      - name: Revalidate remote release tag identity
        working-directory: source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          object="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref {print $1}' <<< "$refs")"
          peeled="$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref {print $1}' <<< "$refs")"
          test "$object" = "$EXPECTED_TAG_OBJECT_SHA"
          test "$peeled" = "$EXPECTED_SOURCE_SHA"

      - name: Verify release source checkout
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (2026-08-05)

      # Exchanges the GitHub OIDC token for a short-lived crates.io token
      # (auto-revoked afterwards). No CARGO_REGISTRY_TOKEN secret needed.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # cargo publish builds the crate (including the V8 snapshot) to verify
      # the package before uploading; a failed build aborts the publish.
      - name: Publish
        working-directory: source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CARGO_BUILD_JOBS: 1
        run: cargo publish --locked

  publish-pypi:
    name: publish to PyPI
    if: >-
      github.repository == 'agentsyaml/libdeno' &&
      (github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [preflight, python-verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-publish-${{ needs.preflight.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Revalidate remote release tag identity
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          object="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref {print $1}' <<< "$refs")"
          peeled="$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref {print $1}' <<< "$refs")"
          test "$object" = "$EXPECTED_TAG_OBJECT_SHA"
          test "$peeled" = "$EXPECTED_SOURCE_SHA"

      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libdeno-wheel-*
          path: dist
          merge-multiple: true

      # Confirmed full SHA for the official PyPI Docker action.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist

  github-release:
    name: create GitHub Release
    if: >-
      github.repository == 'agentsyaml/libdeno' &&
      needs.publish-crates.result == 'success' &&
      needs.publish-pypi.result == 'success'
    needs: [preflight, publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}

      # The repo main page's Releases sidebar lists GitHub Releases, not tags
      # or crates.io versions — publishing without a Release leaves it empty.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          object="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref {print $1}' <<< "$refs")"
          peeled="$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref {print $1}' <<< "$refs")"
          test -n "$object" || { echo "annotated release tag $RELEASE_TAG is missing"; exit 1; }
          test -n "$peeled" || { echo "release tag $RELEASE_TAG is not annotated"; exit 1; }
          test "$object" = "$EXPECTED_TAG_OBJECT_SHA" || {
            echo "release tag object changed after preflight"; exit 1;
          }
          test "$peeled" = "$EXPECTED_SOURCE_SHA" || {
            echo "release tag peeled source changed after preflight"; exit 1;
          }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
