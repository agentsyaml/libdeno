# Dependabot configuration.
#
# github-actions is enabled so the commit-SHA pins in .github/workflows stay
# fresh (dependabot updates SHA + version comment together). Weekly is plenty
# for actions.
#
# cargo is intentionally NOT enabled: the deno stack publishes new releases
# weekly, so cargo dependabot would open a PR (and trigger a fresh V8 snapshot
# rebuild in CI) every week. Dependency bumps are instead driven by humans via
# `cargo update`, validated by CI's cargo audit + --locked and the offline
# Deno/TypeScript version ledger. This keeps PR noise down and V8 snapshot
# churn deliberate. Note: dtolnay/rust-toolchain has no version tags — its pin
# is a dated stable-branch SHA and updates manually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action bumps per week, not one per action.
      actions:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain is pinned by commit SHA on two branches
      # (stable + 1.95.0, the MSRV job). Dependabot cannot tell the branches
      # apart and would "upgrade" the 1.95.0 pin onto the stable SHA, silently
      # turning the MSRV check into a stable-toolchain check. Both pins are
      # updated manually (see the note above).
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "chore(ci)"
