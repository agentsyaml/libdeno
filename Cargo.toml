[package]
name = "libdeno"
version = "0.3.8"
edition = "2021"
# Workflow toolchain actions are authoritative for compatibility: stable CI
# plus an explicit MSRV 1.95.0 check. No rust-toolchain.toml is checked in;
# the deno stack publishes no rust-version, and the v8 crate requires edition 2024.
rust-version = "1.95"
description = "Embed the Deno runtime in Rust with direct npm: specifier support"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/libdeno"
repository = "https://github.com/agentsyaml/libdeno"
keywords = ["deno", "runtime", "embed", "npm", "javascript"]
categories = ["api-bindings", "development-tools"]
authors = ["Zhenxing Sun <zhenxing.sun@irootech.com>"]
# Maturin places the Python README at the sdist root under README-pypi.md.
exclude = ["项目完整缺陷与优化审计报告.md", "python/README.md", "python/README-pypi.md"]

# Checked-in compatibility ledger for the upstream Deno snapshot. Cargo does
# not expose the Deno CLI or bundled TypeScript compiler versions, so these
# values are sourced manually from the matching upstream tag. The offline CI
# and release checks compare this ledger with the local source/dependency
# declarations; they deliberately do not claim to query or prove upstream
# provenance.
[package.metadata.libdeno.upstream]
deno-version = "2.9.7"
typescript-version = "6.0.3"
deno-runtime-version = "0.267.0"
deno-core-version = "0.412.0"
deno-resolver-version = "0.90.0"
deno-graph-version = "0.111.0"
v8-version = "15.0.245.2-rusty"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[bench]]
name = "baseline"
harness = false

[dependencies]
deno_runtime = { version = "0.267.0", features = ["transpile"] }
deno_resolver = { version = "0.90.0", features = ["graph", "deno_ast", "sync"] }
node_resolver = "0.97.0"
# deno_runtime is backend-agnostic; the embedder must enable the v8 backend.
deno_core = { version = "0.412.0", features = ["v8", "reactor-tokio", "v8_use_custom_libcxx"] }
# Exact pins: the types of these crates (deno_error, deno_graph,
# deno_semver, deno_media_type) cross the libdeno/deno stack boundary
# directly — trait implementations and function signatures — so each must
# match the deno stack's own internal pins exactly: deno_resolver 0.90.0
# pins deno_graph =0.111.0 and deno_semver =0.10.1; deno_core/deno_runtime
# pin deno_error =0.7.1. Without the exact pin, `cargo update` can resolve
# a second version of the crate, and the duplicated types produce
# unlocatable trait-mismatch compile errors. All other deno dependencies
# stay caret (the committed Cargo.lock + CI's `--locked` pins them in
# practice).
deno_graph = "=0.111.0"
deno_cache_dir = "0.51.0"
deno_config = "0.109.0"
deno_npm_installer = { version = "0.54.0", optional = true }
deno_npm_cache = { version = "0.78.0", optional = true }
deno_npm = "0.71.0"
deno_npmrc = "0.20.0"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
deno_media_type = { version = "=0.4.0", features = ["module_specifier"] }
# Exact pin for the same cross-boundary reason as the block above.
deno_error = "=0.7.1"
sys_traits = "0.1.28"
deno_semver = "=0.10.1"
# Child-mode auth token entropy (already in the tree via the deno stack).
getrandom = "0.4"
async-trait = "0.1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "stream", "http2"] }
http = "1"
bytes = "1"
url = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "process"] }
deno_fs = "0.169.0"
deno_features = "0.56.0"
thiserror = "2"
# fd-level stdout/stderr redirection for output capture (already in the tree
# via the deno stack).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[build-dependencies]
# The snapshot pipeline needs the runtime and the v8 backend linked into the
# build script. deno_runtime is backend-agnostic — the embedder must enable
# deno_core's `v8` feature (same as the normal dependency), otherwise deno_v8
# compiles without its v8 backend in the build-dependency universe. Both are
# optional and feature-gated: docs.rs builds with `no-default-features`, so the
# build script has no dependencies and links nothing (the v8 crate emits no
# static lib under DOCS_RS=1, which would fail the build-script link).
deno_runtime = { version = "0.267.0", features = ["snapshot"], optional = true }
deno_core = { version = "0.412.0", features = ["v8", "reactor-tokio", "v8_use_custom_libcxx"], optional = true }

[features]
default = ["snapshot", "npm"]
# The `npm` feature only gates the npm installer / npm-cache host machinery
# (deno_npm_installer, deno_npm_cache). deno_resolver 0.90.0 depends on
# deno_npm/deno_npmrc unconditionally, so both stay non-optional. Disabling
# the feature removes on-demand installation for bare `npm:` specifiers, but
# node_modules/BYONM resolution is unaffected.
npm = ["dep:deno_npm_installer", "dep:deno_npm_cache"]
phase-diagnostics = []
# Experimental request admission/lifecycle API.  It is deliberately opt-in
# and does not alter the legacy execution entry points.
execution-control = []
# Compiles the V8 runtime snapshot (and residual lazy sources) in build.rs.
# Disable for docs.rs or when using `snapshot-import` with a supplied bundle;
# without either feature the crate gets an empty, non-runnable snapshot.
snapshot = ["dep:deno_runtime", "dep:deno_core"]
# Reuse a prebuilt bundle without linking Deno/V8 into the build script.
snapshot-import = []

# docs.rs cannot build the snapshot pipeline: it requires linking the Deno
# runtime (V8) into the build script, and docs.rs builds offline — the v8
# crate skips emitting its static library when DOCS_RS is set, so the build
# script link fails. docs.rs only rustdoc's the lib (never links/runs it), so
# an empty snapshot + empty residual tables are sufficient. With
# docs.rs uses no default features and does not enable `snapshot-import`, so
# build.rs emits placeholders instead.
[package.metadata.docs.rs]
no-default-features = true

[profile.release]
debug = false
# Release profile for this workspace's own builds (the demo example and CI
# artifacts). Downstream consumers build libdeno as a dependency, where the
# root workspace's profile governs; v8's static library dominates the binary
# there too, so hosts that care about size should enable LTO/strip themselves.
lto = "thin"
strip = true

# Standalone workspace root so downstream projects can consume this crate via
# path/git/patch dependencies without cargo workspace conflicts.
[workspace]

[dev-dependencies]
# Already in the tree via reqwest; needed to build a stream-backed response
# body (unknown content length) in http tests.
futures-util = "0.3"
# Compiles the minimal .node fixture for the native-addon E2E tests.
cc = "1"
# For the tokio-context embedding regression test (run() from an async task).
tokio = { version = "1", features = ["rt"] }
